services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sparkify
      POSTGRES_USER: sparkify
      POSTGRES_PASSWORD: sparkify
    ports:
      - "5432:5432"
    networks:
      - sparkify
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkify -d sparkify"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: sparkify
      WAREHOUSE_USER: sparkify
      WAREHOUSE_PASSWORD: sparkify
      AWS_DEFAULT_REGION: us-west-2
      SONG_DATA: s3://udacity-dend/song_data
      LOG_DATA: s3://udacity-dend/log_data
    depends_on:
      warehouse:
        condition: service_healthy
    networks:
      - sparkify

networks:
  sparkify:
    driver: bridge

volumes:
  warehouse-data:
